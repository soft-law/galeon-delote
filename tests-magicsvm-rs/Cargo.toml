# Isolated test crate: not a workspace member and does not depend on the program crate
# (MagicSVM lives on another Solana crate line). It loads the compiled .so.
[workspace]

[package]
name = "tequila-gacha-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
magicsvm = "=0.3.0"
borsh = { version = "1.6.1", features = ["derive"] }
solana-address = "~2.6.1"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-transaction-error = "~3.3.1"
solana-instruction = "~3.4.0"
solana-sha256-hasher = "3.1.0"
solana-clock = "~3.1.1"
solana-account = "=4.3.2"
